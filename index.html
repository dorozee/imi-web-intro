<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Учебный проект по современной веб-разработке">
    <title>IMI Web Intro — Публикации</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>IMI Web Intro</h1>
            <p>Практика современной веб-разработки</p>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h2>Публикации</h2>
            <p>Данные загружаются с открытого API JSONPlaceholder.</p>
        </section>

        <section class="posts-section" aria-labelledby="posts-heading">
            <div class="section-header">
                <h2 id="posts-heading">Список публикаций</h2>
                <button id="reload-btn" type="button">Обновить</button>
            </div>

            <p id="status" class="status" role="status" aria-live="polite">Загрузка…</p>
            <ul id="posts-list" class="posts-list"></ul>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Учебный проект Павлова Александра, Б-ИВТ-24-2 | 2026</p>
        </div>
    </footer>
</body>
</html>
